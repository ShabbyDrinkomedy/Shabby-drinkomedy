<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shabby DrinKomedy - Ordine</title>
<style>body{font-family:sans-serif;background:#111;color:#fff;padding:15px;margin:0}.card{background:#222;padding:20px;border-radius:15px;max-width:500px;margin:auto}h1{text-align:center;color:#00ff88}label{display:block;margin-top:15px;font-weight:bold;color:#ccc}select,input,textarea{width:100%;padding:14px;border-radius:10px;border:none;margin-top:6px;box-sizing:border-box;font-size:16px}textarea{min-height:70px}button{background:#00ff88;color:#000;border:none;padding:16px;width:100%;border-radius:12px;font-weight:bold;margin-top:20px;font-size:18px}</style>
</head>
<body><h1>🍺 Shabby DrinKomedy</h1><div class="card">
<label>📍 POSTO * e nome (facoltativo)</label><input id="posto" type="text" placeholder="Es: 12 o 12 Mario - SOLO NOME NON VALE">
<label>🍹 Cosa vuoi ordinare?</label><select id="drink"><option value="">-- Scegli --</option><option value="Articolo bar generico">Articolo bar - generico</option><option value="Pinta bionda">Pinta bionda</option><option value="Mezza pinta bionda">Mezza pinta bionda</option><option value="Pinta rossa">Pinta rossa</option><option value="Mezza pinta rossa">Mezza pinta rossa</option><option value="IPA 33CL">IPA 33CL</option><option value="Birra in bottiglia">Birra in bottiglia</option><option value="Gin Tonic">Gin Tonic</option><option value="Gin Lemon">Gin Lemon</option><option value="Spritz Aperol">Spritz Aperol</option><option value="Spritz Campari">Spritz Campari</option><option value="Spritz generico">Spritz generico</option><option value="Calice vino rosso">Calice vino rosso</option><option value="Calice vino bianco">Calice vino bianco</option><option value="Calice vino rosé">Calice vino rosé</option><option value="Acqua">Acqua</option><option value="Bibita">Bibita</option></select>
<label>📝 Note</label><textarea id="note" placeholder="Es: Hendricks, Negroni..."></textarea>
<button onclick="invia()">INVIA ORDINE 🚀</button><p id="msg" style="text-align:center;margin-top:15px"></p></div>
<script>
const BOT_TOKEN="9138005946:AAFvdZjsBuBR5FnhBtfSs_wxh88BGxDcSEk";const CHAT_ID="-1004443351538";
function invia(){const posto=document.getElementById('posto').value.trim();const drink=document.getElementById('drink').value;const note=document.getElementById('note').value.trim();if(!posto){alert("Devi inserire il posto!");return}if(!/\d/.test(posto)){alert("Devi inserire il NUMERO del posto! Esempio: 12 oppure 12 Mario. Solo il nome NON basta.");return}if(!drink){alert("Scegli cosa ordinare!");return}let testo=`🔔 NUOVO ORDINE\n🪑 Posto: ${posto}\n🍹 Ordine: ${drink}`;if(note)testo+=`\n📝 Note: ${note}`;document.getElementById('msg').textContent="✅ Ordine inviato al bar!";const url=`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(testo)}`;fetch(url,{mode:'no-cors'}).catch(()=>{});const img=new Image();img.src=url;}
</script></body></html>
