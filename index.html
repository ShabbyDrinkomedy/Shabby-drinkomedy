<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drinkomedy - Ordini</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:20px;max-width:500px;margin:auto}
h1{text-align:center;color:#ffcc00}
.card{background:#222;padding:15px;border-radius:12px;margin-bottom:12px}
input,button{width:100%;padding:12px;border-radius:8px;border:none;margin-top:8px;font-size:16px}
button{background:#ffcc00;font-weight:bold;cursor:pointer}
.item{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.item button{width:40px}
</style>
</head>
<body>
<h1>🍺 Drinkomedy Cilento</h1>

<div class="card">
<label>Tavolo / Nome Cliente</label>
<input id="tavolo" placeholder="Es. Tavolo 5 o Mario">
</div>

<div class="card">
<label>Articolo bar generico (scrivi tu)</label>
<input id="generico" placeholder="Es. 2 spritz, 1 caffè">
</div>

<div class="card" id="lista">
<h3>Birre alla spina</h3>
<div class="item"><span>Pinta Bionda</span><div><button onclick="chg('bionda',-1)">-</button><span id="bionda">0</span><button onclick="chg('bionda',1)">+</button></div></div>
<div class="item"><span>Pinta Rossa</span><div><button onclick="chg('rossa',-1)">-</button><span id="rossa">0</span><button onclick="chg('rossa',1)">+</button></div></div>
<div class="item"><span>Pinta Bianca</span><div><button onclick="chg('bianca',-1)">-</button><span id="bianca">0</span><button onclick="chg('bianca',1)">+</button></div></div>
</div>

<div class="card">
<button onclick="invia()">INVIA ORDINE SU TELEGRAM</button>
<p id="stato" style="text-align:center;margin-top:10px"></p>
</div>

<script>
const TOKEN="9138005946:AAH73KjnovdpkiTY7l2vlTa5hOh3me11Ui0";
const CHAT_ID="-1004443351538";
let q={bionda:0,rossa:0,bianca:0};
function chg(k,d){q[k]=Math.max(0,q[k]+d);document.getElementById(k).innerText=q[k]}
async function invia(){
 let tavolo=document.getElementById('tavolo').value||'Non specificato';
 let gen=document.getElementById('generico').value||'';
 let msg=`🍺 NUOVO ORDINE DRINKOMEDY\n\n📍 ${tavolo}\n`;
 if(gen) msg+=`📝 Generico: ${gen}\n`;
 msg+=`\n---\n`;
 if(q.bionda>0) msg+=`Pinta Bionda: ${q.bionda}\n`;
 if(q.rossa>0) msg+=`Pinta Rossa: ${q.rossa}\n`;
 if(q.bianca>0) msg+=`Pinta Bianca: ${q.bianca}\n`;
 if(q.bionda+q.rossa+q.bianca==0 && !gen){alert('Aggiungi qualcosa!');return}
 document.getElementById('stato').innerText='Invio in corso...';
 try{
  let res=await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({chat_id:CHAT_ID,text:msg})
  });
  let data=await res.json();
  if(data.ok){document.getElementById('stato').innerText='✅ Ordine inviato su Telegram!'; q={bionda:0,rossa:0,bianca:0};['bionda','rossa','bianca'].forEach(k=>document.getElementById(k).innerText=0)}
  else{document.getElementById('stato').innerText='Errore: '+JSON.stringify(data)}
 }catch(e){document.getElementById('stato').innerText='Errore di rete'}
}
</script>
</body>
</html>
